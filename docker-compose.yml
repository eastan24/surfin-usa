services:
  db:
    image: postgis/postgis:16-3.4
    container_name: surfin-db
    environment:
      POSTGRES_USER: surfin
      POSTGRES_PASSWORD: surfin_dev_password
      POSTGRES_DB: surfin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
